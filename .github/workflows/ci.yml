name: Open_SDK CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-typescript:
    name: TS SDK (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install workspace dependencies
        run: npm ci || npm install

      - name: Build TypeScript Client
        run: npm run build

      - name: Run Vitest Suite
        run: npm test

  test-python:
    name: Python SDK (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest pytest-asyncio

      - name: Run Pytest Suite
        working-directory: sdks/python
        run: pytest -v

  # 发布前体检：验证**发布产物**真的可用
  #
  # 为什么单列一个 job：本地测试跑的是**源码**，不是**发布产物**。
  # `files` 漏文件、`exports` 路径写错、缺运行时依赖、README/LICENSE 没进 tarball
  # —— 这类缺陷只有"真的打包并安装"才暴露（历史上确实漏过 README 与 LICENSE）。
  preflight-release:
    name: Release Preflight (pack / install / use)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Run release preflight
        run: bash scripts/preflight-release.sh
